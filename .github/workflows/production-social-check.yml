name: Production social check

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-social-rollout:
    if: ${{ !contains(github.event.head_commit.message, '[skip render]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source configuration
        uses: actions/checkout@v4

      - name: Validate source-controlled Instagram publishing state
        id: instagram_publishing
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path
          import re

          lines = Path("render.yaml").read_text(encoding="utf-8").splitlines()
          service_starts = [
              index
              for index, line in enumerate(lines)
              if re.fullmatch(r"  - type:\s*\S+\s*", line)
          ]
          matching_services = []
          for position, start in enumerate(service_starts):
              end = service_starts[position + 1] if position + 1 < len(service_starts) else len(lines)
              block = lines[start:end]
              names = [
                  line.strip().split(":", 1)[1].strip().strip("\"'")
                  for line in block
                  if re.fullmatch(r"\s+name:\s*[^#]+\s*", line)
              ]
              if names == ["lecturesift-instagram-daily"]:
                  matching_services.append(block)

          if len(matching_services) != 1:
              raise SystemExit(
                  "render.yaml must define exactly one lecturesift-instagram-daily service"
              )

          block = matching_services[0]
          key_lines = [
              index
              for index, line in enumerate(block)
              if re.fullmatch(
                  r"\s+- key:\s*INSTAGRAM_DAILY_AUTOMATION_ENABLED\s*",
                  line,
              )
          ]
          if len(key_lines) != 1:
              raise SystemExit(
                  "lecturesift-instagram-daily must define exactly one "
                  "INSTAGRAM_DAILY_AUTOMATION_ENABLED value"
              )

          value_index = key_lines[0] + 1
          if value_index >= len(block):
              raise SystemExit("INSTAGRAM_DAILY_AUTOMATION_ENABLED has no literal value")
          value_line = block[value_index].strip()
          if not value_line.startswith("value:"):
              raise SystemExit("INSTAGRAM_DAILY_AUTOMATION_ENABLED must use a literal value")
          literal = value_line.split(":", 1)[1].strip()
          values = {
              "true": "true",
              '"true"': "true",
              "'true'": "true",
              "false": "false",
              '"false"': "false",
              "'false'": "false",
          }
          if literal not in values:
              raise SystemExit(
                  "INSTAGRAM_DAILY_AUTOMATION_ENABLED must be literal true or false"
              )
          print(f"enabled={values[literal]}")
          PY

      - name: Wait for Render deployment and API health
        shell: bash
        run: |
          set -euo pipefail
          health_url="https://api.lecturesift.com/health"
          expected_revision="${GITHUB_SHA,,}"
          [[ "$expected_revision" =~ ^[0-9a-f]{40}$ ]] || {
            echo "GITHUB_SHA is not one full commit id." >&2
            exit 1
          }
          for attempt in $(seq 1 40); do
            if body=$(curl --silent --show-error --fail --max-time 20 "$health_url"); then
              revision=$(python -c \
                'import json,sys; print(str(json.loads(sys.argv[1]).get("revision", "unknown")).lower())' \
                "$body")
              if [ "$revision" = "$expected_revision" ]; then
                echo "Production is serving expected revision $expected_revision."
                break
              fi
              echo "Production still serves revision $revision; waiting for $expected_revision."
            fi
            if [ "$attempt" -eq 40 ]; then
              echo "Production API did not serve GITHUB_SHA in time; social checks are blocked." >&2
              exit 1
            fi
            sleep 15
          done

      - name: Verify Instagram connection and completed launch grid
        if: ${{ steps.instagram_publishing.outputs.enabled == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          instagram_health="https://api.lecturesift.com/instagram/health"
          launch_status="https://api.lecturesift.com/instagram/launch/status"

          echo "Instagram health:"
          curl --silent --show-error --fail --max-time 25 "$instagram_health"
          echo

          for attempt in $(seq 1 32); do
            if body=$(curl --silent --show-error --fail --max-time 25 "$launch_status"); then
              echo "Launch status: $body"
              count=$(python -c 'import json,sys; print(json.loads(sys.argv[1]).get("completed_count", 0))' "$body")
              if [ "$count" -ge 9 ]; then
                break
              fi
            fi
            if [ "$attempt" -eq 32 ]; then
              echo "Completed Instagram launch grid was not observed in time." >&2
              exit 1
            fi
            sleep 15
          done

      - name: Read deployment-time Instagram repair status
        if: ${{ steps.instagram_publishing.outputs.enabled == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          bootstrap="https://api.lecturesift.com/instagram/launch/bootstrap"
          for attempt in $(seq 1 24); do
            if body=$(curl --silent --show-error --fail --max-time 25 "$bootstrap"); then
              echo "Instagram repair status: $body"
              status=$(python -c 'import json,sys; print(json.loads(sys.argv[1]).get("status", "unknown"))' "$body")
              if [ "$status" = "error" ] || [ "$status" = "launch_not_complete" ]; then
                echo "Instagram repair helper reported $status." >&2
                exit 1
              fi
              if [ "$status" != "waiting" ] && [ "$status" != "retrying" ] && [ "$status" != "not_started" ]; then
                break
              fi
            fi
            if [ "$attempt" -eq 24 ]; then
              echo "Instagram repair helper did not settle in time." >&2
              exit 1
            fi
            sleep 10
          done

      - name: Verify today's bilingual Reel after publishing window
        if: ${{ steps.instagram_publishing.outputs.enabled == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          hour=$(date -u +%H)
          if [ "$hour" -lt 17 ]; then
            echo "Daily Instagram publishing window has not opened yet; skipping daily marker check."
            exit 0
          fi

          today=$(date -u +%F)
          daily_status="https://api.lecturesift.com/instagram/daily/status?day=$today"
          for attempt in $(seq 1 32); do
            if body=$(curl --silent --show-error --fail --max-time 25 "$daily_status"); then
              echo "Daily status: $body"
              present=$(python -c 'import json,sys; print("true" if json.loads(sys.argv[1]).get("marker_present") else "false")' "$body")
              complete=$(python -c 'import json,sys; print("true" if json.loads(sys.argv[1]).get("launch_complete") else "false")' "$body")
              if [ "$present" = "true" ] && [ "$complete" = "true" ]; then
                exit 0
              fi
            fi
            if [ "$attempt" -eq 32 ]; then
              echo "Today's bilingual Instagram Reel marker was not observed in time." >&2
              exit 1
            fi
            sleep 15
          done
