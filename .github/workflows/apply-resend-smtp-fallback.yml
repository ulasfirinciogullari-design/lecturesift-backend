name: Apply Resend SMTP fallback

on:
  push:
    branches:
      - fix/resend-smtp-fallback
    paths:
      - .github/workflows/apply-resend-smtp-fallback.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out SMTP fallback branch
        uses: actions/checkout@v4
        with:
          ref: fix/resend-smtp-fallback
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Apply SMTP fallback integration
        run: python scripts/apply_resend_smtp_fallback.py

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt pytest

      - name: Run backend tests
        run: python -m pytest -q

      - name: Validate frontend JavaScript
        run: |
          node --check frontend/app.js
          node --check frontend/email-auth.js

      - name: Commit validated SMTP fallback
        run: |
          rm -f scripts/apply_resend_smtp_fallback.py .github/workflows/apply-resend-smtp-fallback.yml
          git config user.name "LectureSift CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: fall back to Resend SMTP after API 403"
          git push origin HEAD:fix/resend-smtp-fallback
