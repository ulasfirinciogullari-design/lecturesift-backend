name: Apply official Resend SDK

on:
  push:
    branches:
      - fix/use-official-resend-sdk
    paths:
      - .github/workflows/apply-resend-sdk.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out SDK branch
        uses: actions/checkout@v4
        with:
          ref: fix/use-official-resend-sdk
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Apply SDK migration
        run: python scripts/apply_resend_sdk.py

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt pytest

      - name: Run backend tests
        run: python -m pytest -q

      - name: Validate frontend JavaScript
        run: |
          node --check frontend/app.js
          node --check frontend/email-auth.js

      - name: Commit validated SDK migration
        run: |
          rm -f scripts/apply_resend_sdk.py .github/workflows/apply-resend-sdk.yml
          git config user.name "LectureSift CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: send verification email with official Resend SDK"
          git push origin HEAD:fix/use-official-resend-sdk
