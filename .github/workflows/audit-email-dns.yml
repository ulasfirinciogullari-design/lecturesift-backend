name: Audit LectureSift email DNS

on:
  push:
    branches:
      - ops/email-dns-audit
    paths:
      - .github/workflows/audit-email-dns.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Install DNS tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dnsutils

      - name: Query public and authoritative DNS
        shell: bash
        run: |
          set -euo pipefail

          query() {
            local type="$1"
            local name="$2"
            local server="${3:-}"
            local result
            if [[ -n "$server" ]]; then
              result="$(dig +time=3 +tries=1 +short "$type" "$name" "@$server" 2>/dev/null || true)"
            else
              result="$(dig +time=3 +tries=1 +short "$type" "$name" 2>/dev/null || true)"
            fi
            printf '%-7s %-55s %s\n' "$type" "$name" "${result:-<none>}"
          }

          echo '=== Recursive resolver view ==='
          query NS lecturesift.com
          query A lecturesift.com
          query CNAME lecturesift.com
          query A www.lecturesift.com
          query CNAME www.lecturesift.com
          query MX lecturesift.com
          query TXT lecturesift.com
          query TXT _dmarc.lecturesift.com
          query MX mail.lecturesift.com
          query TXT mail.lecturesift.com
          query CNAME mail.lecturesift.com
          query MX send.mail.lecturesift.com
          query TXT send.mail.lecturesift.com
          query TXT resend._domainkey.mail.lecturesift.com
          query CNAME resend._domainkey.mail.lecturesift.com
          query TXT _dmarc.mail.lecturesift.com
          query CAA lecturesift.com

          echo
          echo '=== Authoritative nameserver views ==='
          mapfile -t nameservers < <(dig +short NS lecturesift.com | sed 's/\.$//')
          if [[ ${#nameservers[@]} -eq 0 ]]; then
            echo 'No authoritative nameservers returned.'
            exit 1
          fi
          for ns in "${nameservers[@]}"; do
            echo "--- $ns ---"
            query MX send.mail.lecturesift.com "$ns"
            query TXT send.mail.lecturesift.com "$ns"
            query TXT resend._domainkey.mail.lecturesift.com "$ns"
            query TXT _dmarc.lecturesift.com "$ns"
          done

      - name: Confirm corrected live sender and frontend integration
        shell: bash
        run: |
          set -euo pipefail

          expected_sender='LectureSift <no-reply@mail.lecturesift.com>'
          matched=false
          for attempt in $(seq 1 40); do
            body="$(curl --fail --location --silent --show-error \
              --retry 2 --retry-delay 3 --retry-all-errors --max-time 120 \
              https://lecturesift-backend.onrender.com/billing/email/health || true)"
            if [[ -n "$body" ]]; then
              printf '%s' "$body" > /tmp/email-health.json
              sender="$(python -c 'import json; print(json.load(open("/tmp/email-health.json")).get("sender") or "")' 2>/dev/null || true)"
              configured="$(python -c 'import json; print(str(json.load(open("/tmp/email-health.json")).get("configured", False)).lower())' 2>/dev/null || true)"
              required="$(python -c 'import json; print(str(json.load(open("/tmp/email-health.json")).get("verification_required", False)).lower())' 2>/dev/null || true)"
              database_ready="$(python -c 'import json; print(str(json.load(open("/tmp/email-health.json")).get("database", {}).get("ready", False)).lower())' 2>/dev/null || true)"
              echo "Attempt $attempt: sender=$sender configured=$configured required=$required database_ready=$database_ready"
              if [[ "$sender" == "$expected_sender" && "$configured" == "true" && "$required" == "true" && "$database_ready" == "true" ]]; then
                matched=true
                break
              fi
            fi
            sleep 10
          done

          if [[ "$matched" != "true" ]]; then
            echo 'The live backend did not expose the corrected verified-domain sender.'
            [[ -f /tmp/email-health.json ]] && python -m json.tool /tmp/email-health.json || true
            exit 1
          fi
          python -m json.tool /tmp/email-health.json

          echo
          echo '=== Frontend verification module ==='
          curl --fail --location --silent --show-error \
            --retry 5 --retry-delay 3 --retry-all-errors --max-time 90 \
            https://lecturesift.com/email-auth.js \
            | tee /tmp/email-auth.js >/dev/null
          grep -q 'Verify your email address' /tmp/email-auth.js
          echo 'email-auth.js is live and contains the verification interface.'
