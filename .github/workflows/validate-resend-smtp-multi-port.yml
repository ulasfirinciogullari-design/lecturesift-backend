name: Validate Resend SMTP multi-port fallback

on:
  push:
    branches:
      - fix/resend-smtp-multi-port
    paths:
      - .github/workflows/validate-resend-smtp-multi-port.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out multi-port branch
        uses: actions/checkout@v4
        with:
          ref: fix/resend-smtp-multi-port
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt pytest

      - name: Run backend tests
        run: python -m pytest -q

      - name: Validate frontend JavaScript
        run: |
          node --check frontend/app.js
          node --check frontend/email-auth.js

      - name: Record validated multi-port fallback
        run: |
          rm -f .github/workflows/validate-resend-smtp-multi-port.yml
          git config user.name "LectureSift CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "ci: record validated Resend SMTP multi-port fallback"
          git push origin HEAD:fix/resend-smtp-multi-port
