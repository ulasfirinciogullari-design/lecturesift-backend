name: Probe live Resend delivery

on:
  push:
    branches:
      - ops/email-dns-audit
    paths:
      - .github/workflows/probe-resend-delivery.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed Resend multi-port SMTP fallback
        shell: bash
        run: |
          set -euo pipefail

          # Give Render's automatic main-branch deployment a head start before
          # probing a change that was merged immediately before this workflow.
          sleep 75

          for attempt in $(seq 1 8); do
            email="delivered+lecturesift-multiport-${GITHUB_RUN_ID}-${attempt}@resend.dev"
            password="$(python -c 'import secrets; print(secrets.token_urlsafe(24))')"
            export TEST_EMAIL="$email" TEST_PASSWORD="$password" ATTEMPT="$attempt"
            python - <<'PY' > /tmp/register-payload.json
          import json
          import os
          print(json.dumps({
              "email": os.environ["TEST_EMAIL"],
              "password": os.environ["TEST_PASSWORD"],
              "language": "tr",
          }))
          PY

            status="$(curl --location --silent --show-error \
              --output /tmp/register-response.json --write-out '%{http_code}' \
              --header 'Content-Type: application/json' \
              --data-binary @/tmp/register-payload.json \
              https://lecturesift-backend.onrender.com/billing/register)"

            export HTTP_STATUS="$status"
            echo "Attempt $attempt — HTTP $status"
            python -m json.tool /tmp/register-response.json || cat /tmp/register-response.json

            outcome="$(python - <<'PY'
          import json
          import os

          try:
              with open('/tmp/register-response.json', encoding='utf-8') as handle:
                  body = json.load(handle)
          except Exception:
              print('retry')
              raise SystemExit

          if os.environ['HTTP_STATUS'] == '200' and body.get('verification_required') is True:
              print('success')
              raise SystemExit

          detail = body.get('detail') if isinstance(body, dict) else None
          if isinstance(detail, dict):
              provider_code = detail.get('provider_code')
              legacy_codes = {'http_403', 'InternalServerError', 'forbidden_unknown'}
              if provider_code in legacy_codes:
                  print('retry')
                  raise SystemExit
              if provider_code == 'smtp_unavailable' and int(os.environ['ATTEMPT']) < 2:
                  print('retry')
                  raise SystemExit
              if provider_code:
                  print('diagnosed')
                  raise SystemExit
          print('retry')
          PY
            )"

            if [[ "$outcome" == "success" ]]; then
              echo 'Controlled verification email was accepted by Resend.'
              exit 0
            fi
            if [[ "$outcome" == "diagnosed" ]]; then
              echo 'The deployed multi-port fallback returned the safe final diagnosis above.'
              exit 2
            fi
            sleep 10
          done

          echo 'The multi-port deployment or final provider response was not observed.'
          exit 1
