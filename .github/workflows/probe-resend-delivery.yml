name: Probe live Resend delivery

on:
  push:
    branches:
      - ops/email-dns-audit
    paths:
      - .github/workflows/probe-resend-delivery.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for diagnostic deployment and probe delivery
        shell: bash
        run: |
          set -euo pipefail

          for attempt in $(seq 1 60); do
            email="delivered+lecturesift-${GITHUB_RUN_ID}-${attempt}@resend.dev"
            password="$(python -c 'import secrets; print(secrets.token_urlsafe(24))')"
            export TEST_EMAIL="$email" TEST_PASSWORD="$password"
            python - <<'PY' > /tmp/register-payload.json
          import json
          import os
          print(json.dumps({
              "email": os.environ["TEST_EMAIL"],
              "password": os.environ["TEST_PASSWORD"],
              "language": "tr",
          }))
          PY

            status="$(curl --location --silent --show-error \
              --output /tmp/register-response.json --write-out '%{http_code}' \
              --header 'Content-Type: application/json' \
              --data-binary @/tmp/register-payload.json \
              https://lecturesift-backend.onrender.com/billing/register)"

            export HTTP_STATUS="$status"
            echo "Attempt $attempt — HTTP $status"
            python -m json.tool /tmp/register-response.json || cat /tmp/register-response.json

            outcome="$(python - <<'PY'
          import json
          import os

          try:
              with open('/tmp/register-response.json', encoding='utf-8') as handle:
                  body = json.load(handle)
          except Exception:
              print('retry')
              raise SystemExit

          if os.environ['HTTP_STATUS'] == '200' and body.get('verification_required') is True:
              print('success')
              raise SystemExit

          detail = body.get('detail') if isinstance(body, dict) else None
          if isinstance(detail, dict) and detail.get('provider_code'):
              print('diagnosed')
          else:
              print('retry')
          PY
            )"

            if [[ "$outcome" == "success" ]]; then
              echo 'Controlled Resend delivery was accepted.'
              exit 0
            fi
            if [[ "$outcome" == "diagnosed" ]]; then
              echo 'A safe Resend provider status/code is now available above.'
              exit 2
            fi
            sleep 10
          done

          echo 'Diagnostic deployment or provider response was not observed.'
          exit 1
