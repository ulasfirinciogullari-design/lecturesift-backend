name: Probe live Resend delivery

on:
  push:
    branches:
      - ops/email-dns-audit
    paths:
      - .github/workflows/probe-resend-delivery.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Verify official SDK deployment and live delivery
        shell: bash
        run: |
          set -euo pipefail

          for attempt in $(seq 1 60); do
            email="delivered+lecturesift-sdk-${GITHUB_RUN_ID}-${attempt}@resend.dev"
            password="$(python -c 'import secrets; print(secrets.token_urlsafe(24))')"
            export TEST_EMAIL="$email" TEST_PASSWORD="$password"
            python - <<'PY' > /tmp/register-payload.json
          import json
          import os
          print(json.dumps({
              "email": os.environ["TEST_EMAIL"],
              "password": os.environ["TEST_PASSWORD"],
              "language": "tr",
          }))
          PY

            status="$(curl --location --silent --show-error \
              --output /tmp/register-response.json --write-out '%{http_code}' \
              --header 'Content-Type: application/json' \
              --data-binary @/tmp/register-payload.json \
              https://lecturesift-backend.onrender.com/billing/register)"

            export HTTP_STATUS="$status"
            echo "Attempt $attempt — HTTP $status"
            python -m json.tool /tmp/register-response.json || cat /tmp/register-response.json

            outcome="$(python - <<'PY'
          import json
          import os

          try:
              with open('/tmp/register-response.json', encoding='utf-8') as handle:
                  body = json.load(handle)
          except Exception:
              print('retry')
              raise SystemExit

          if os.environ['HTTP_STATUS'] == '200' and body.get('verification_required') is True:
              print('success')
              raise SystemExit

          detail = body.get('detail') if isinstance(body, dict) else None
          if isinstance(detail, dict):
              provider_code = detail.get('provider_code')
              # The legacy custom HTTP client could only expose this generic
              # code. Keep polling until the official SDK deployment is live.
              if provider_code and provider_code != 'http_403':
                  print('diagnosed')
                  raise SystemExit
          print('retry')
          PY
            )"

            if [[ "$outcome" == "success" ]]; then
              echo 'Controlled Resend delivery was accepted through the official SDK.'
              exit 0
            fi
            if [[ "$outcome" == "diagnosed" ]]; then
              echo 'The official SDK returned a safe structured provider diagnosis above.'
              exit 2
            fi
            sleep 10
          done

          echo 'The official SDK deployment or final provider response was not observed.'
          exit 1
