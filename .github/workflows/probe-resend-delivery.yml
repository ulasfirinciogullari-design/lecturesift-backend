name: Probe live Resend delivery

on:
  push:
    branches:
      - ops/email-dns-audit
    paths:
      - .github/workflows/probe-resend-delivery.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check current email configuration and controlled registration
        shell: bash
        run: |
          set -euo pipefail

          echo '=== Backend health ==='
          curl --fail --location --silent --show-error \
            --retry 3 --retry-delay 2 --retry-all-errors --max-time 180 \
            https://lecturesift-backend.onrender.com/health \
            | tee /tmp/health.json
          echo
          python -m json.tool /tmp/health.json

          echo
          echo '=== Billing health ==='
          billing_status="$(curl --location --silent --show-error \
            --retry 3 --retry-delay 2 --retry-all-errors --max-time 180 \
            --output /tmp/billing-health.json --write-out '%{http_code}' \
            https://lecturesift-backend.onrender.com/billing/health)"
          echo "HTTP $billing_status"
          python -m json.tool /tmp/billing-health.json || cat /tmp/billing-health.json

          echo
          echo '=== Controlled registration and Resend delivery ==='
          for attempt in $(seq 1 4); do
            email="delivered+lecturesift-current-${GITHUB_RUN_ID}-${attempt}@resend.dev"
            password="$(python -c 'import secrets; print(secrets.token_urlsafe(24))')"
            export TEST_EMAIL="$email" TEST_PASSWORD="$password"

            python - <<'PY' > /tmp/register-payload.json
          import json
          import os
          print(json.dumps({
              "email": os.environ["TEST_EMAIL"],
              "password": os.environ["TEST_PASSWORD"],
              "first_name": "LectureSift",
              "last_name": "Delivery Check",
              "phone": "",
              "country_code": "TR"
          }))
          PY

            status="$(curl --location --silent --show-error \
              --retry 2 --retry-delay 2 --retry-all-errors --max-time 180 \
              --output /tmp/register-response.json --write-out '%{http_code}' \
              --header 'Content-Type: application/json' \
              --data-binary @/tmp/register-payload.json \
              https://lecturesift-backend.onrender.com/billing/register)"

            echo "Attempt $attempt - HTTP $status"
            python -m json.tool /tmp/register-response.json || cat /tmp/register-response.json

            if [[ "$status" == "200" ]]; then
              python - <<'PY'
          import json
          with open('/tmp/register-response.json', encoding='utf-8') as handle:
              body = json.load(handle)
          assert body.get('ok') is True
          assert body.get('verification_required') is True
          assert body.get('user', {}).get('email')
          assert 'verification_token' not in body
          assert 'verification_code' not in body
          print('RESULT: live verification email accepted by Resend')
          PY
              exit 0
            fi

            sleep 6
          done

          echo 'RESULT: live verification email was not accepted'
          exit 1
