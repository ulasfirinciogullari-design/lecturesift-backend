name: Probe live Resend delivery

on:
  push:
    branches:
      - ops/email-dns-audit
    paths:
      - .github/workflows/probe-resend-delivery.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check DNS, email health, and controlled registration
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update -qq
          sudo apt-get install -y -qq dnsutils >/dev/null

          echo '=== Public DNS ==='
          printf 'MX send.mail.lecturesift.com: '
          dig +short MX send.mail.lecturesift.com | tr '\n' ' '; echo
          printf 'SPF send.mail.lecturesift.com: '
          dig +short TXT send.mail.lecturesift.com | tr '\n' ' '; echo
          printf 'DKIM resend._domainkey.mail.lecturesift.com: '
          dig +short TXT resend._domainkey.mail.lecturesift.com | tr '\n' ' '; echo
          printf 'A lecturesift.com: '
          dig +short A lecturesift.com | tr '\n' ' '; echo
          printf 'CNAME www.lecturesift.com: '
          dig +short CNAME www.lecturesift.com | tr '\n' ' '; echo

          echo
          echo '=== Email health ==='
          curl --fail --location --silent --show-error \
            --retry 3 --retry-delay 3 --retry-all-errors --max-time 180 \
            https://lecturesift-backend.onrender.com/billing/email/health \
            | tee /tmp/email-health.json
          echo
          python -m json.tool /tmp/email-health.json

          echo
          echo '=== Controlled Resend delivery ==='
          for attempt in $(seq 1 6); do
            email="delivered+lecturesift-check-${GITHUB_RUN_ID}-${attempt}@resend.dev"
            password="$(python -c 'import secrets; print(secrets.token_urlsafe(24))')"
            export TEST_EMAIL="$email" TEST_PASSWORD="$password"

            python - <<'PY' > /tmp/register-payload.json
          import json
          import os
          print(json.dumps({
              "email": os.environ["TEST_EMAIL"],
              "password": os.environ["TEST_PASSWORD"],
              "language": "tr",
          }))
          PY

            status="$(curl --location --silent --show-error \
              --retry 2 --retry-delay 2 --retry-all-errors --max-time 180 \
              --output /tmp/register-response.json --write-out '%{http_code}' \
              --header 'Content-Type: application/json' \
              --data-binary @/tmp/register-payload.json \
              https://lecturesift-backend.onrender.com/billing/register)"

            echo "Attempt $attempt - HTTP $status"
            python -m json.tool /tmp/register-response.json || cat /tmp/register-response.json

            if [[ "$status" == "200" ]]; then
              python - <<'PY'
          import json
          with open('/tmp/register-response.json', encoding='utf-8') as handle:
              body = json.load(handle)
          assert body.get('ok') is True
          assert body.get('verification_required') is True
          assert body.get('email')
          assert 'token' not in body
          print('RESULT: verification email accepted by Resend')
          PY
              exit 0
            fi

            sleep 8
          done

          echo 'RESULT: verification email was not accepted'
          exit 1
