name: Apply Resend delivery diagnostics

on:
  push:
    branches:
      - fix/resend-delivery-diagnostics
    paths:
      - .github/workflows/apply-resend-diagnostics.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out diagnostics branch
        uses: actions/checkout@v4
        with:
          ref: fix/resend-delivery-diagnostics
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Apply diagnostics patch
        run: python scripts/apply_resend_diagnostics.py

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt pytest

      - name: Run backend tests
        run: python -m pytest -q

      - name: Validate frontend JavaScript
        run: |
          node --check frontend/app.js
          node --check frontend/email-auth.js

      - name: Commit validated diagnostics
        run: |
          rm -f scripts/apply_resend_diagnostics.py .github/workflows/apply-resend-diagnostics.yml
          git config user.name "LectureSift CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: expose safe Resend delivery diagnostics"
          git push origin HEAD:fix/resend-delivery-diagnostics
