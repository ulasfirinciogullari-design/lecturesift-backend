name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Check frontend JavaScript syntax
        run: |
          node --check frontend/app.js
          node --check frontend/platform.js
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Install Python dependencies
        run: pip install -r requirements.txt pytest
      - name: Run tests
        env:
          OPENAI_API_KEY: ""
          CELERY_BROKER_URL: ""
          REDIS_URL: ""
          S3_ENDPOINT_URL: ""
          S3_BUCKET: ""
          S3_ACCESS_KEY_ID: ""
          S3_SECRET_ACCESS_KEY: ""
          RESEND_API_KEY: ""
          LECTURESIFT_ADMIN_TOKEN: ""
          BANK_TRANSFER_IBAN: ""
          BANK_TRANSFER_RECIPIENT: ""
        run: pytest -q
