name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Feature branches are tested through their PR, not again for the same push.
# Keep default-branch coverage after merge and discard superseded revisions.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: .
      OPENAI_API_KEY: ""
      DATABASE_URL: sqlite:////tmp/lecturesift-ci.db
      BILLING_SESSION_SECRET: ci-session-secret-with-sufficient-length
      BILLING_ADMIN_TOKEN: ci-admin-secret
      EMAIL_PROVIDER: none
      EMAIL_FROM: ""
      RESEND_API_KEY: ""
      CELERY_BROKER_URL: ""
      REDIS_URL: ""
      S3_ENDPOINT_URL: ""
      S3_BUCKET: ""
      S3_ACCESS_KEY_ID: ""
      S3_SECRET_ACCESS_KEY: ""
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check deployment shell syntax
        run: bash deploy/check_shell_syntax.sh
      - name: Validate locked image inputs before building
        run: python3 deploy/supply_chain_lock.py --root .
      - name: Build locked egress proxy without cache
        run: |
          docker build --pull --no-cache --platform linux/amd64 \
            --tag lecturesift-egress-proxy:ci \
            deploy/egress-proxy
      - name: Smoke test locked egress proxy
        run: |
          docker run --rm --network none \
            --entrypoint /bin/sh \
            lecturesift-egress-proxy:ci -ec '
              test -s /etc/ssl/certs/ca-certificates.crt
              test ! -L /etc/ssl/certs/ca-certificates.crt
              dpkg-query -W ca-certificates squid squidclient >/dev/null
              grep -Fqx "URIs: https://snapshot.debian.org/archive/debian/20260828T000000Z" /etc/apt/sources.list.d/debian.sources
              grep -Fqx "URIs: https://snapshot.debian.org/archive/debian-security/20260828T000000Z" /etc/apt/sources.list.d/debian.sources
              ! grep -q "^URIs: http://" /etc/apt/sources.list.d/debian.sources
            '
      - name: Build and verify the shared media image
        run: docker build --pull --platform linux/amd64 --tag lecturesift-media:ci .
      - name: Probe external YouTube availability (reported separately)
        # Provider/IP availability is independent of deterministic regression
        # tests. A failed probe stays visible but does not skip those tests.
        continue-on-error: true
        run: |
          probe_name="lecturesift-youtube-probe-$GITHUB_RUN_ID"
          trap 'docker rm -f "$probe_name" >/dev/null 2>&1 || true' EXIT
          timeout 120s docker run --rm --name "$probe_name" \
            --memory 512m --cpus 1 --pids-limit 128 --read-only \
            --tmpfs /tmp:rw,nosuid,size=64m \
            --tmpfs /var/lib/lecturesift:rw,nosuid,size=32m \
            -i lecturesift-media:ci python - < deploy/youtube_probe.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Apply deterministic rollout integrations
        run: python scripts/apply_rollout_integration.py
      - name: Check Python syntax
        run: python -m compileall -q lecturesift tests
      - name: Check frontend JavaScript syntax
        run: |
          for file in frontend/*.js; do
            node --check "$file"
          done
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core tesseract-ocr tesseract-ocr-eng tesseract-ocr-tur
      - name: Install Python dependencies
        run: pip install --require-hashes -r requirements-dev.txt
      - name: Validate Render blueprint YAML
        run: python -c "import yaml; yaml.safe_load(open('render.yaml', encoding='utf-8'))"
      - name: Run tests
        run: pytest -q

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set browser cache path on the allocated runner
        run: echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/lecturesift-browsers" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned browser test dependencies (no lifecycle scripts)
        working-directory: tests/browser
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build the actual localized static site
        run: node scripts/build_localized_site.mjs
      - name: Install Chromium and its system dependencies
        working-directory: tests/browser
        run: npx --no-install playwright install --with-deps chromium
      - name: Run browser smoke tests without external network access
        # Both Chromium and its loopback-only static server inherit this network
        # namespace. No interface/route to production, ads, payments or DNS exists.
        # Dependency downloads happen above; artifact upload happens below.
        # Root only creates the namespace; tests and Chromium run as the runner.
        run: |
          sudo env CI=true PLAYWRIGHT_BROWSERS_PATH="$PLAYWRIGHT_BROWSERS_PATH" \
            unshare --net -- bash -c '
              set -eu
              ip link set lo up
              ci_uid="$1"; ci_gid="$2"; ci_home="$3"; shift 3
              exec setpriv --reuid "$ci_uid" --regid "$ci_gid" --init-groups \
                -- env HOME="$ci_home" "$@"
            ' bash "$(id -u)" "$(id -g)" "$HOME" \
            "$(command -v node)" \
            "$GITHUB_WORKSPACE/tests/browser/node_modules/@playwright/test/cli.js" \
            test --config "$GITHUB_WORKSPACE/tests/browser/playwright.config.mjs"
      - name: Upload synthetic browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-failure-${{ github.run_attempt }}
          path: |
            tests/browser/test-results/
            tests/browser/playwright-report/
          if-no-files-found: ignore
          retention-days: 3
