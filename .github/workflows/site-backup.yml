name: LectureSift Site Backup

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lecturesift-site-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh latest backup branch
        run: |
          set -euo pipefail
          git config user.name "LectureSift Backup Bot"
          git config user.email "backup@lecturesift.com"
          git branch -f backup/latest "$GITHUB_SHA"
          git push origin backup/latest --force

      - name: Build restorable archives
        run: |
          set -euo pipefail
          mkdir -p backup-package
          git archive --format=tar.gz --output="backup-package/LectureSift-${GITHUB_SHA}.tar.gz" HEAD
          tar -czf "backup-package/LectureSift-Frontend-${GITHUB_SHA}.tar.gz" frontend netlify.toml

      - name: Retain backup archives for 90 days
        uses: actions/upload-artifact@v4
        with:
          name: lecturesift-site-backup-${{ github.run_number }}
          path: backup-package/*.tar.gz
          if-no-files-found: error
          retention-days: 90

