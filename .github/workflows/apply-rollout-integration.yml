name: apply-rollout-integration

on:
  push:
    branches: [feature/complete-product-rollout]

concurrency:
  group: apply-rollout-integration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[rollout-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/complete-product-rollout
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply integrations
        run: python scripts/apply_rollout_integration.py
      - name: Commit integrations when needed
        run: |
          if git diff --quiet; then
            echo "No integration changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend lecturesift
          git commit -m "chore: apply rollout integrations [rollout-patched]"
          git push origin HEAD:feature/complete-product-rollout
