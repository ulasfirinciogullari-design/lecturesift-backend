<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LectureSift</title><style>*{box-sizing:border-box}body{margin:0;background:#071023;color:#f5f8ff;font-family:system-ui}.w{max-width:1050px;margin:auto;padding:22px}.nav{display:flex;align-items:center}.logo{font-size:22px;font-weight:900;margin-right:auto}.logo i{color:#916bff;font-style:normal}select,input,button{font:inherit}select,input{background:#0d1b36;color:white;border:1px solid #284269;border-radius:10px;padding:11px}h1{font-size:clamp(38px,7vw,68px);line-height:1;letter-spacing:-2px;text-align:center;margin:58px 0 12px}.g{background:linear-gradient(90deg,#249cff,#9754ff);color:transparent;background-clip:text}.lead{text-align:center;color:#9eb0cf;font-size:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:30px 0}.card{background:#101d38;border:1px solid #284269;border-radius:18px;padding:20px}.drop{border:1px dashed #42669f;border-radius:14px;padding:22px;text-align:center}.url{width:100%;margin-top:12px}.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}label{display:block;color:#9eb0cf;font-size:12px;margin-bottom:5px}select{width:100%}button{border:0;border-radius:10px;padding:13px 16px;font-weight:800;cursor:pointer}.pri{width:100%;margin-top:14px;color:white;background:linear-gradient(90deg,#249cff,#9754ff)}.prog{display:none}.pct{font-size:38px;font-weight:900}.bar{height:11px;background:#172a4c;border-radius:9px;overflow:hidden;margin:12px 0}.fill{height:100%;width:0;background:linear-gradient(90deg,#249cff,#9754ff);transition:.3s}.muted{color:#9eb0cf}.res{display:none;margin-bottom:40px}.tabs{display:flex;gap:7px;flex-wrap:wrap}.tab{background:#102244;color:white;border:1px solid #284269}.tab.on{background:#2b4e91}.pane{display:none;margin-top:12px}.pane.on{display:block}.box,.item{background:#0a1730;border:1px solid #284269;border-radius:12px;padding:15px;margin:9px 0;white-space:pre-wrap;line-height:1.55}.slides{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.slides img{width:100%;border-radius:9px}@media(max-width:750px){.grid,.opts{grid-template-columns:1fr}.slides{grid-template-columns:1fr 1fr}}</style></head><body><div class="w"><div class="nav"><div class="logo">▶ Lecture<i>Sift</i></div><select id="ui"></select></div><h1>LectureSift <span class="g">Study Pack</span></h1><p class="lead">Slides · Transcript · Notes · Summary · Quiz · Flashcards</p><div class="grid"><div class="card"><div class="drop"><h3 id="t0"></h3><input id="file" type="file" accept="video/*"><div class="muted" id="fn"></div><input id="url" class="url" type="url" placeholder="https://youtube.com/..."></div><div class="opts"><div><label id="t5"></label><select id="src"></select></div><div><label id="t6"></label><select id="out"></select></div><div><label id="t7"></label><select id="style"></select></div><div><label id="t8"></label><select id="qc"><option>5</option><option selected>10</option><option>20</option><option>30</option></select></div><div><label id="t9"></label><select id="fc"><option>10</option><option selected>20</option><option>40</option><option>60</option></select></div></div><button id="go" class="pri"></button></div><div class="card"><h3>LectureSift V3.1</h3><p>🖼️ Slides</p><p>🔎 Transcript</p><p>📝 Notes & summary</p><p>☑️ Quiz</p><p>🧠 Flashcards</p><div class="prog" id="prog"><div class="pct" id="pct">0%</div><div id="stage" class="muted"></div><div id="tm" class="muted">00:00</div><div class="bar"><div class="fill" id="fill"></div></div></div></div></div><div class="card res" id="res"><h2 id="title">LectureSift</h2><button id="dl" class="pri"></button><div class="tabs"><button class="tab on" data-p="sum" id="t14"></button><button class="tab" data-p="notes" id="t15"></button><button class="tab" data-p="tr" id="t16"></button><button class="tab" data-p="slides" id="t17"></button><button class="tab" data-p="quiz">Quiz</button><button class="tab" data-p="flash">Flashcards</button></div><div class="pane on" id="p-sum"><div class="box" id="sum"></div></div><div class="pane" id="p-notes"><div id="notes"></div></div><div class="pane" id="p-tr"><div class="box" id="tr"></div></div><div class="pane" id="p-slides"><div class="slides" id="slides"></div></div><div class="pane" id="p-quiz"><div id="quiz"></div></div><div class="pane" id="p-flash"><div id="flash"></div></div></div></div><script>const API='https://lecturesift-backend.onrender.com',L={"tr":["Türkçe","Ders videosu veya bağlantı","Dosya seç","veya video bağlantısı yapıştır","Videoyu işle","Video dili","Çıktı dili","Özet biçimi","Quiz","Flashcards","Kısa","Standart","Detaylı","Sınav odaklı","Özet","Ders notları","Transkript","Slaytlar","Tüm paketi indir"],"en":["English","Lecture video or URL","Choose file","or paste video URL","Process video","Source language","Output language","Summary style","Quiz","Flashcards","Short","Standard","Detailed","Exam-focused","Summary","Notes","Transcript","Slides","Download complete pack"],"de":["Deutsch","Vorlesungsvideo oder Link","Datei wählen","oder Video-Link einfügen","Video verarbeiten","Videosprache","Ausgabesprache","Zusammenfassungsstil","Quiz","Lernkarten","Kurz","Standard","Detailliert","Prüfungsorientiert","Zusammenfassung","Notizen","Transkript","Folien","Gesamtpaket herunterladen"],"fr":["Français","Vidéo de cours ou lien","Choisir un fichier","ou coller le lien vidéo","Traiter la vidéo","Langue source","Langue de sortie","Style de résumé","Quiz","Cartes mémoire","Court","Standard","Détaillé","Examen","Résumé","Notes","Transcription","Diapositives","Télécharger le pack"],"es":["Español","Video de clase o enlace","Elegir archivo","o pegar enlace de video","Procesar video","Idioma de origen","Idioma de salida","Tipo de resumen","Quiz","Tarjetas","Corto","Estándar","Detallado","Examen","Resumen","Apuntes","Transcripción","Diapositivas","Descargar paquete"],"it":["Italiano","Video lezione o link","Scegli lue=localStorage.lsui||'tr';src.value='auto';out.value=ui.value;function lang(){const d=L[ui.value]||L.en;document.documentElement.lang=ui.value;document.documentElement.dir=ui.value==='ar'?'rtl':'ltr';['t0','x','x','x','x','t5','t6','t7','t8','t9'].forEach((id,i)=>{if(document.getElementById(id))document.getElementById(id).textContent=d[i]});go.textContent=d[4];dl.textContent=d[18];t14.textContent=d[14];t15.textContent=d[15];t16.textContent=d[16];t17.textContent=d[17];style.innerHTML='';[10,11,12,13].forEach((i,j)=>style.add(new Option(d[i],['short','standard','detailed','exam'][j])));style.value='standard';localStorage.lsui=ui.value}ui.onchange=()=>{lang();out.value=ui.value};lang();file.onchange=()=>fn.textContent=file.files[0]?.name||'';let jid=null,t0=null,poller=null;function prog(p,s){document.getElementById('prog').style.display='block';pct.textContent=Math.round(p)+'%';fill.style.width=p+'%';stage.textContent=s}function clock(){if(t0)tm.textContent=new Date(Date.now()-t0).toISOString().slice(14,19)}setInterval(clock,1000);async function poll(){const r=await fetch(`${API}/jobs/${jid}`),j=await r.json();prog(j.percent||0,j.stage||'');if(j.status==='done'){clearInterval(poller);show()}else if(j.status==='error'){clearInterval(poller);alert(j.error||'Error')}}go.onclick=async()=>{const f=file.files[0],u=url.value.trim();if(!f&&!u){file.click();return}const fd=new FormData();fd.append('source_language',src.value);fd.append('output_language',out.value);fd.append('summary_style',style.value);fd.append('quiz_count',qc.value);fd.append('flashcard_count',fc.value);t0=Date.now();if(u&&!f){fd.append('video_url',u);prog(3,'Downloading video from URL');const r=await fetch(API+'/jobs/url',{method:'POST',body:fd});if(!r.ok)return alert(await r.text());jid=(await r.json()).job_id;poller=setInterval(poll,1200);return}fd.append('file',f);prog(2,'Uploading');const x=new XMLHttpRequest();x.open('POST',API+'/jobs');x.upload.onprogress=e=>e.lengthComputable&&prog(Math.min(9,e.loaded/e.total*9),'Uploading');x.onload=()=>{if(x.status<300){jid=JSON.parse(x.responseText).job_id;poller=setInterval(poll,1200)}else alert(x.responseText)};x.send(fd)};function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}async function show(){prog(100,'Done');const d=await(await fetch(`${API}/jobs/${jid}/result`)).json();res.style.display='block';title.textContent=d.title||'LectureSift';sum.textContent=d.summary||'';tr.textContent=d.transcript||'';notes.innerHTML=(d.notes||[]).map(n=>`<div class="item"><h3>${esc(n.heading)}</h3><p>${esc(n.content)}</p><ul>${(n.bullets||[]).map(b=>`<li>${esc(b)}</li>`).join('')}</ul></div>`).join('');slides.innerHTML=(d.slides||[]).map(s=>`<div><img src="${API}/jobs/${jid}/slide/${encodeURIComponent(s.file)}"><small>${s.second}s</small></div>`).join('')||'<div class="box">No slides detected.</div>';quiz.innerHTML=(d.quiz||[]).map((q,n)=>`<div class="item"><b>${n+1}. ${esc(q.question)}</b><ul>${(q.options||[]).map(o=>`<li>${esc(o)}</li>`).join('')}</ul><small>${esc(q.explanation)}</small></div>`).join('');flash.innerHTML=(d.flashcards||[]).map(x=>`<div class="item"><b>${esc(x.front)}</b><hr><span>${esc(x.back)}</span></div>`).join('');dl.onclick=()=>location.href=`${API}/jobs/${jid}/download`;res.scrollIntoView({behavior:'smooth'})}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));document.querySelectorAll('.pane').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.getElementById('p-'+b.dataset.p).classList.add('on')});</script></body></html>
