<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>İletişim | LectureSift</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/auth.css"><link rel="stylesheet" href="/rollout.css?v=9"><link rel="stylesheet" href="/theme.css?v=12"><script src="/theme.js?v=2"></script>
</head>
<body data-page="support">
  <header class="auth-topbar"><a class="brand" href="/"><span class="brand-mark"><i></i><i></i><i></i></span><span>Lecture<span>Sift</span></span></a><a class="back-link" href="/contact.html" data-i18n="support.back">İletişime dön</a></header>
  <main class="public-support-shell">
    <article class="public-support-card">
      <p class="eyebrow" data-i18n="support.eyebrow">Güvenli destek konuşması</p>
      <h1 data-i18n="support.title">LectureSift destek ekibiyle konuş</h1>
      <p class="lead" data-i18n="support.intro">Yanıtların aynı konuşmada saklanır. Parola, kart bilgisi veya doğrulama kodu paylaşma.</p>
      <div id="supportStatus" class="notice public-support-status" role="status" data-i18n="support.loading">Konuşma yükleniyor…</div>
      <section id="supportThread" class="support-thread" hidden aria-live="polite"></section>
      <form id="supportReplyForm" hidden>
        <label class="field"><span data-i18n="support.replyLabel">Yanıtın</span><textarea name="message" minlength="2" maxlength="4000" required data-i18n-placeholder="support.placeholder" placeholder="Mesajını yaz…"></textarea></label>
        <button type="submit" data-i18n="support.send">Yanıtı gönder</button>
      </form>
    </article>
  </main>
  <script src="/page-i18n.js?v=6"></script><script src="/i18n.js?v=27"></script><script src="/site-shell.js?v=4"></script><script src="/support.js?v=1"></script>
</body>
</html>
