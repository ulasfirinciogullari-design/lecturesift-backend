<!-- LectureSift gerçek backend bağlantısı için örnek.
Mevcut index.html içindeki video yükleme alanına daha sonra entegre edeceğiz. -->
<script>
const API_BASE = "https://BURAYA-RENDER-ADRESIN.onrender.com";

async function processRealVideo(file, language="auto") {
  const fd = new FormData();
  fd.append("file", file);
  const url = `${API_BASE}/process?language=${encodeURIComponent(language)}`;
  const res = await fetch(url, {method:"POST", body:fd});
  if (!res.ok) throw new Error(await res.text());
  const blob = await res.blob();
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "LectureSift_Result.zip";
  a.click();
  URL.revokeObjectURL(a.href);
}
</script>
