# Additional least-privilege SSH account; existing administrator rules remain.
AllowUsers lecturesift-dev

Match User lecturesift-dev
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AllowAgentForwarding no
    X11Forwarding no
    PermitTunnel no
    AllowTcpForwarding local
    PermitOpen 127.0.0.1:1455 127.0.0.1:8765
Match all
