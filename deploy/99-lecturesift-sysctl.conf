# Keep enough RAM available for OCR/FFmpeg while allowing swap to absorb
# exceptional peaks instead of letting the kernel kill the worker.
vm.swappiness = 10
vm.vfs_cache_pressure = 50
vm.overcommit_memory = 1

# Queue and file-watcher headroom for Docker, Caddy and background workers.
net.core.somaxconn = 4096
fs.inotify.max_user_watches = 524288
