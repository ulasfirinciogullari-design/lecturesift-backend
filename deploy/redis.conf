bind 0.0.0.0
# Redis is not published to the host and only joins the Compose internal
# backend network. Protected mode rejects legitimate API/worker containers
# when no password is configured, so the network boundary is the access gate.
protected-mode no
port 6379
dir /data

appendonly yes
appendfsync everysec
aof-use-rdb-preamble yes
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

save 900 1
save 300 10
save 60 10000
rdbcompression yes
rdbchecksum yes

maxmemory 512mb
maxmemory-policy noeviction
stop-writes-on-bgsave-error yes
