# LectureSift worker egress boundary.  The worker has no direct Internet
# network; every HTTP(S) request, redirect and new DNS resolution crosses this
# proxy.  Destination ACLs are evaluated by Squid after resolution, so literal
# and DNS-resolved private/link-local/documentation/multicast ranges fail shut.
http_port 3128
visible_hostname lecturesift-egress-proxy
pid_filename /run/squid/squid.pid
coredump_dir /tmp

access_log stdio:/dev/stdout
cache_log /dev/stderr
cache_store_log none
cache deny all
cache_mem 16 MB
maximum_object_size_in_memory 512 KB
cache_dir null /tmp

acl all src all
acl manager proto cache_object
acl localhost src 127.0.0.1/32 ::1/128
acl SSL_ports port 443
acl Safe_ports port 80 443
acl CONNECT method CONNECT
acl allowed_methods method GET HEAD POST PUT PATCH DELETE OPTIONS CONNECT

acl forbidden_destination dst \
    0.0.0.0/8 \
    10.0.0.0/8 \
    100.64.0.0/10 \
    127.0.0.0/8 \
    169.254.0.0/16 \
    172.16.0.0/12 \
    192.0.0.0/24 \
    192.0.2.0/24 \
    192.88.99.0/24 \
    192.168.0.0/16 \
    198.18.0.0/15 \
    198.51.100.0/24 \
    203.0.113.0/24 \
    224.0.0.0/4 \
    240.0.0.0/4 \
    ::/128 \
    ::1/128 \
    fc00::/7 \
    fe80::/10 \
    ff00::/8 \
    2001:db8::/32

http_access allow localhost manager
http_access deny manager
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access deny !allowed_methods
http_access deny forbidden_destination
http_access allow all

# Do not disclose the client's internal address or accept forwarding headers
# supplied by an untrusted remote source.
forwarded_for delete
request_header_access X-Forwarded-For deny all
request_header_access Via deny all
request_header_access Cache-Control allow all
request_header_access All allow all

shutdown_lifetime 1 seconds
