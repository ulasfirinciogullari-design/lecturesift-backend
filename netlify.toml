[build]
  publish = "frontend"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://securepubads.g.doubleclick.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.googlesyndication.com https://*.doubleclick.net; media-src 'self' blob:; connect-src 'self' https://lecturesift-backend.onrender.com https://securepubads.g.doubleclick.net https://*.doubleclick.net; frame-src https://www.paytr.com https://securepubads.g.doubleclick.net https://*.googlesyndication.com; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"

[[headers]]
  for = "/verify.html"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/reset-password.html"
  [headers.values]
    Cache-Control = "no-store"
