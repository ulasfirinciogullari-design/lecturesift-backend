[build]
  command = "node scripts/build_localized_site.mjs"
  publish = "dist"

[[context.deploy-preview.plugins]]
  package = "@netlify/plugin-csp-nonce"
  [context.deploy-preview.plugins.inputs]
    reportOnly = true
    path = [
      "/",
      "/features",
      "/plans",
      "/about",
      "/en/",
      "/en/features",
      "/en/plans",
      "/en/about",
      "/de/",
      "/de/features",
      "/de/plans",
      "/de/about",
      "/fr/",
      "/fr/features",
      "/fr/plans",
      "/fr/about",
      "/es/",
      "/es/features",
      "/es/plans",
      "/es/about",
      "/it/",
      "/it/features",
      "/it/plans",
      "/it/about",
      "/pt/",
      "/pt/features",
      "/pt/plans",
      "/pt/about",
      "/ru/",
      "/ru/features",
      "/ru/plans",
      "/ru/about",
      "/ar/",
      "/ar/features",
      "/ar/plans",
      "/ar/about",
      "/zh/",
      "/zh/features",
      "/zh/plans",
      "/zh/about",
      "/ja/",
      "/ja/features",
      "/ja/plans",
      "/ja/about",
      "/ko/",
      "/ko/features",
      "/ko/plans",
      "/ko/about",
      "/hi/",
      "/hi/features",
      "/hi/plans",
      "/hi/about",
    ]

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://www.googletagmanager.com https://www.googleadservices.com https://www.google.com https://googleads.g.doubleclick.net https://securepubads.g.doubleclick.net https://pagead2.googlesyndication.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://www.googletagmanager.com https://www.googleadservices.com https://google.com https://www.google.com.tr https://www.google-analytics.com https://*.google.com https://*.googlesyndication.com https://*.doubleclick.net; media-src 'self' blob:; connect-src 'self' https://www.googleadservices.com https://www.google.com https://google.com https://www.google.com.tr https://*.analytics.google.com https://api.lecturesift.com https://lecturesift-backend.onrender.com https://www.google-analytics.com https://*.google-analytics.com https://www.googletagmanager.com https://securepubads.g.doubleclick.net https://pagead2.googlesyndication.com https://*.googlesyndication.com https://*.doubleclick.net; frame-src https://www.paytr.com https://www.googletagmanager.com https://securepubads.g.doubleclick.net https://googleads.g.doubleclick.net https://*.googlesyndication.com; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/og-image.png"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/verify.html"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/reset-password.html"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/:lang/verify.html"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/:lang/reset-password.html"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/account.html"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/:lang/account.html"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/admin.html"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/:lang/admin.html"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/support.html"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/:lang/support.html"
  [headers.values]
    Cache-Control = "no-store"
