services:
  - type: keyvalue
    name: lecturesift-queue
    plan: starter
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot

  - type: web
    name: lecturesift-backend
    runtime: docker
    plan: free
    autoDeployTrigger: checksPass
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: lecturesift-queue
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: lecturesift-queue
          property: connectionString
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: CONTACT_EMAIL
        value: support@lecturesift.com
      - key: EMAIL_FROM
        value: LectureSift <noreply@lecturesift.com>
      - key: RESEND_API_KEY
        sync: false
      - key: LECTURESIFT_ADMIN_TOKEN
        sync: false
      - key: BANK_TRANSFER_IBAN
        sync: false
      - key: BANK_TRANSFER_RECIPIENT
        sync: false
      - key: LECTURESIFT_INSTAGRAM_ACCOUNT
        value: lecturesift
      - key: LECTURESIFT_GUEST_TRIAL_MAX_MINUTES
        value: "5"
      - key: LECTURESIFT_INSTAGRAM_BONUS_MINUTES
        value: "30"

  - type: worker
    name: lecturesift-worker
    runtime: docker
    plan: starter
    autoDeployTrigger: checksPass
    dockerCommand: celery -A lecturesift.queue.celery_app worker --loglevel=INFO --concurrency=1
    maxShutdownDelaySeconds: 300
    envVars:
      - key: LECTURESIFT_WORKER
        value: "1"
      - key: OPENAI_API_KEY
        sync: false
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: lecturesift-queue
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: lecturesift-queue
          property: connectionString
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
