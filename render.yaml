services:
  - type: keyvalue
    name: lecturesift-queue
    plan: starter
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot

  - type: web
    name: lecturesift-backend
    runtime: docker
    plan: free
    autoDeploy: true
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: LECTURESIFT_PRECISE_TRANSCRIPT_TIMESTAMPS
        value: "false"
      - key: LECTURESIFT_TRANSCRIPTION_PARALLELISM
        value: "3"
      - key: LECTURESIFT_TRANSLATION_PARALLELISM
        value: "3"
      - key: LECTURESIFT_STUDY_PACK_PARALLELISM
        value: "3"
      - key: LECTURESIFT_MAX_DOCUMENT_BYTES
        value: "52428800"
      - key: LECTURESIFT_MAX_DOCUMENT_PAGES
        value: "500"
      - key: LECTURESIFT_MAX_DOCUMENT_CHARACTERS
        value: "1500000"
      - key: LECTURESIFT_DOCUMENT_WORDS_PER_CREDIT_MINUTE
        value: "200"
      - key: LECTURESIFT_COST_RENDER_MONTHLY_USD
        sync: false
      - key: LECTURESIFT_COST_NETLIFY_MONTHLY_USD
        value: "20"
      - key: LECTURESIFT_COST_RESEND_MONTHLY_USD
        value: "0"
      - key: LECTURESIFT_COST_OTHER_MONTHLY_USD
        value: "0"
      - key: LECTURESIFT_COST_USD_TRY_FALLBACK
        value: "42"
      - key: INSTAGRAM_ACCESS_TOKEN
        sync: false
      - key: INSTAGRAM_ACCOUNT_ID
        sync: false
      - key: INSTAGRAM_APP_SECRET
        sync: false
      - key: INSTAGRAM_ADMIN_TOKEN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: lecturesift-postgres
          property: connectionString
      - key: BILLING_SESSION_SECRET
        generateValue: true
      - key: ADMIN_ADMIN
        sync: false
      - key: BILLING_PROTECTED_EMAILS
        sync: false
      - key: BILLING_BANK_IBAN
        sync: false
      - key: BILLING_BANK_ACCOUNT_HOLDER
        sync: false
      - key: BILLING_BANK_NAME
        sync: false
      - key: PAYTR_MERCHANT_ID
        sync: false
      - key: PAYTR_MERCHANT_KEY
        sync: false
      - key: PAYTR_MERCHANT_SALT
        sync: false
      - key: PAYTR_TEST_MODE
        value: "true"
      - key: PAYTR_DEBUG
        value: "false"
      - key: IYZICO_API_KEY
        sync: false
      - key: IYZICO_SECRET_KEY
        sync: false
      - key: IYZICO_BASE_URL
        value: https://api.iyzipay.com
      - key: CONTACT_EMAIL
        value: support@lecturesift.com
      - key: BILLING_SUPPORT_EMAIL
        value: support@lecturesift.com
      - key: LEGAL_OPERATOR_NAME
        sync: false
      - key: LEGAL_OPERATOR_ADDRESS
        sync: false
      - key: LEGAL_OPERATOR_COUNTRY
        sync: false
      - key: LEGAL_OPERATOR_PHONE
        sync: false
      - key: LEGAL_OPERATOR_EMAIL
        sync: false
      - key: LEGAL_TAX_ID
        sync: false
      - key: LEGAL_TAX_OFFICE
        sync: false
      - key: LEGAL_REGISTRATION_ID
        sync: false
      - key: LEGAL_MERSIS_ID
        sync: false
      - key: LEGAL_TRADE_REGISTRY
        sync: false
      - key: LEGAL_KEP_ADDRESS
        sync: false
      - key: LEGAL_CHAMBER_NAME
        sync: false
      - key: EMAIL_PROVIDER
        value: resend
      - key: EMAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: FRONTEND_BASE_URL
        value: https://lecturesift.com
      - key: INSTAGRAM_DAILY_AUTOMATION_ENABLED
        value: true
      - key: INSTAGRAM_DAILY_MEDIA_TYPE
        value: REELS
      - key: PUBLIC_BASE_URL
        value: https://lecturesift-backend.onrender.com
      - key: LECTURESIFT_GUEST_TRIAL_MINUTES
        value: "5"
      - key: LECTURESIFT_REQUIRE_DURABLE_PROCESSING
        value: "true"
      - key: LECTURESIFT_INSTAGRAM_BONUS_MINUTES
        value: "30"
      - key: LECTURESIFT_REWARDED_ADS_ENABLED
        value: "false"
      - key: LECTURESIFT_REWARDED_AD_UNIT_PATH
        sync: false
      - key: LECTURESIFT_REWARDED_AD_MINUTES_PER_VIEW
        value: "1"
      - key: LECTURESIFT_REWARDED_AD_DAILY_LIMIT_MINUTES
        value: "3"
      - key: LECTURESIFT_DISPLAY_ADS_ENABLED
        value: "false"
      - key: LECTURESIFT_DISPLAY_AD_UNIT_PATH
        sync: false
      - key: LECTURESIFT_ADSENSE_PUBLISHER_ID
        value: ca-pub-7608481350058806
      - key: LECTURESIFT_SITE_BANNER_ENABLED
        value: "true"
      - key: LECTURESIFT_ACCOUNT_ACTIVITY_RETENTION_DAYS
        value: "180"
      - key: LECTURESIFT_ANALYTICS_ENABLED
        value: "false"
      - key: LECTURESIFT_GA_MEASUREMENT_ID
        sync: false
      - key: LECTURESIFT_GOOGLE_ADS_ID
        sync: false
      - key: LECTURESIFT_GOOGLE_ADS_SIGNUP_LABEL
        sync: false
      - key: LECTURESIFT_GOOGLE_ADS_PURCHASE_LABEL
        sync: false
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: lecturesift-queue
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: lecturesift-queue
          property: connectionString
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: LECTURESIFT_DATABASE_RECOVERY_CONFIRMED
        value: "false"
      - key: LECTURESIFT_OBJECT_RETENTION_CONFIRMED
        value: "false"
      - key: LECTURESIFT_RECOVERY_DRILL_CONFIRMED
        value: "false"

  - type: worker
    name: lecturesift-worker
    runtime: docker
    plan: starter
    dockerCommand: celery -A lecturesift.queue.celery_app worker --loglevel=INFO --concurrency=1
    maxShutdownDelaySeconds: 300
    envVars:
      - key: LECTURESIFT_WORKER
        value: "1"
      - key: OPENAI_API_KEY
        sync: false
      - key: LECTURESIFT_PRECISE_TRANSCRIPT_TIMESTAMPS
        value: "false"
      - key: LECTURESIFT_TRANSCRIPTION_PARALLELISM
        value: "3"
      - key: LECTURESIFT_TRANSLATION_PARALLELISM
        value: "3"
      - key: LECTURESIFT_STUDY_PACK_PARALLELISM
        value: "3"
      - key: LECTURESIFT_MAX_DOCUMENT_BYTES
        value: "52428800"
      - key: LECTURESIFT_MAX_DOCUMENT_PAGES
        value: "500"
      - key: LECTURESIFT_MAX_DOCUMENT_CHARACTERS
        value: "1500000"
      - key: LECTURESIFT_DOCUMENT_WORDS_PER_CREDIT_MINUTE
        value: "200"
      - key: DATABASE_URL
        fromDatabase:
          name: lecturesift-postgres
          property: connectionString
      - key: LECTURESIFT_GUEST_TRIAL_MINUTES
        value: "5"
      - key: LECTURESIFT_INSTAGRAM_BONUS_MINUTES
        value: "30"
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: lecturesift-queue
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: lecturesift-queue
          property: connectionString
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false

  - type: cron
    name: lecturesift-instagram-daily
    runtime: docker
    plan: starter
    schedule: "0 17 * * *"
    dockerCommand: python -m lecturesift.daily_social
    envVars:
      - key: INSTAGRAM_ACCESS_TOKEN
        sync: false
      - key: INSTAGRAM_ACCOUNT_ID
        sync: false
      - key: INSTAGRAM_APP_SECRET
        sync: false
      - key: INSTAGRAM_DAILY_AUTOMATION_ENABLED
        value: true
      - key: INSTAGRAM_DAILY_MEDIA_TYPE
        value: REELS
      - key: PUBLIC_BASE_URL
        value: https://lecturesift-backend.onrender.com
