services:
  - type: keyvalue
    name: lecturesift-queue
    plan: starter
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot

  - type: web
    name: lecturesift-backend
    runtime: docker
    plan: free
    autoDeploy: true
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: INSTAGRAM_ACCESS_TOKEN
        sync: false
      - key: INSTAGRAM_ACCOUNT_ID
        sync: false
      - key: INSTAGRAM_APP_SECRET
        sync: false
      - key: INSTAGRAM_ADMIN_TOKEN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: lecturesift-postgres
          property: connectionString
      - key: BILLING_SESSION_SECRET
        generateValue: true
      - key: BILLING_ADMIN_TOKEN
        generateValue: true
      - key: BILLING_BANK_IBAN
        sync: false
      - key: BILLING_BANK_ACCOUNT_HOLDER
        sync: false
      - key: BILLING_BANK_NAME
        sync: false
      - key: PAYTR_MERCHANT_ID
        sync: false
      - key: PAYTR_MERCHANT_KEY
        sync: false
      - key: PAYTR_MERCHANT_SALT
        sync: false
      - key: PAYTR_TEST_MODE
        value: "true"
      - key: PAYTR_DEBUG
        value: "false"
      - key: CONTACT_EMAIL
        value: support@lecturesift.com
      - key: BILLING_SUPPORT_EMAIL
        value: support@lecturesift.com
      - key: EMAIL_PROVIDER
        value: resend
      - key: EMAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: FRONTEND_BASE_URL
        value: https://lecturesift.com
      - key: INSTAGRAM_DAILY_AUTOMATION_ENABLED
        value: true
      - key: PUBLIC_BASE_URL
        value: https://lecturesift-backend.onrender.com
      - key: LECTURESIFT_GUEST_TRIAL_MINUTES
        value: "5"
      - key: LECTURESIFT_INSTAGRAM_BONUS_MINUTES
        value: "30"
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: lecturesift-queue
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: lecturesift-queue
          property: connectionString
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false

  - type: worker
    name: lecturesift-worker
    runtime: docker
    plan: starter
    dockerCommand: celery -A lecturesift.queue.celery_app worker --loglevel=INFO --concurrency=1
    maxShutdownDelaySeconds: 300
    envVars:
      - key: LECTURESIFT_WORKER
        value: "1"
      - key: OPENAI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: lecturesift-postgres
          property: connectionString
      - key: LECTURESIFT_GUEST_TRIAL_MINUTES
        value: "5"
      - key: LECTURESIFT_INSTAGRAM_BONUS_MINUTES
        value: "30"
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: lecturesift-queue
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: lecturesift-queue
          property: connectionString
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false

  - type: cron
    name: lecturesift-instagram-daily
    runtime: docker
    plan: starter
    schedule: "0 8 * * *"
    dockerCommand: python -m lecturesift.daily_social
    envVars:
      - key: INSTAGRAM_ACCESS_TOKEN
        sync: false
      - key: INSTAGRAM_ACCOUNT_ID
        sync: false
      - key: INSTAGRAM_APP_SECRET
        sync: false
      - key: INSTAGRAM_DAILY_AUTOMATION_ENABLED
        value: true
      - key: PUBLIC_BASE_URL
        value: https://lecturesift-backend.onrender.com
